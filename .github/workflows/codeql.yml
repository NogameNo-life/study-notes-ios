name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'

jobs:
  analyze:
    runs-on: macos-15
    permissions:
      security-events: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4

      - uses: github/codeql-action/init@v3
        with:
          languages: swift
          build-mode: manual

      - name: Build
        working-directory: StudyNotes
        run: |
          xcodebuild build \
            -project StudyNotes.xcodeproj \
            -scheme StudyNotes \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO

      - uses: github/codeql-action/analyze@v3
        with:
          category: swift 