name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: macos-15
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Show available Xcode and simulators
        run: |
          xcodebuild -version
          xcrun simctl list devices available | head -20

      - name: Build and test
        working-directory: StudyNotes
        run: |
          xcodebuild test \
            -project StudyNotes.xcodeproj \
            -scheme StudyNotes \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            -enableCodeCoverage YES \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TestResults
          path: StudyNotes/TestResults.xcresult

      - name: Convert coverage to Sonar format
        run: |
          bash scripts/xccov-to-sonarqube-generic.sh StudyNotes/TestResults.xcresult > sonarqube-generic-coverage.xml

      - name: SonarQube Cloud scan
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@c7ee0f9df90b7aa20e8dcf9695dcfe2e7da5b4f2 # v7.2.1
