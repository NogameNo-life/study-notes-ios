name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show available Xcode and simulators
        run: |
          xcodebuild -version
          xcrun simctl list devices available | head -20

      - name: Build and test
        working-directory: StudyNotes
        run: |
          xcodebuild test \
            -project StudyNotes.xcodeproj \
            -scheme StudyNotes \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            -enableCodeCoverage YES \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TestResults
          path: StudyNotes/TestResults.xcresult